name: Dentiva CI

on:
  workflow_dispatch:
  push:
    branches: [ "arena/**" ]

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        id: restore
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet restore Dentiva.sln 2>&1 | Tee-Object -FilePath ci-restore.log
          exit $LASTEXITCODE

      - name: Build Release
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build Dentiva.sln -c Release --no-restore -v minimal 2>&1 | Tee-Object -FilePath ci-build.log
          exit $LASTEXITCODE

      - name: Test
        id: test
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test tests/Dentiva.Tests/Dentiva.Tests.csproj -c Release --no-build -v minimal 2>&1 | Tee-Object -FilePath ci-test.log
          exit $LASTEXITCODE

      - name: Publish diagnostics
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          ./build/ci-report.ps1
          -Restore '${{ steps.restore.outcome }}'
          -Build '${{ steps.build.outcome }}'
          -Test '${{ steps.test.outcome }}'

      - name: Gate
        if: always()
        shell: pwsh
        run: |
          $failed = @()
          if ('${{ steps.restore.outcome }}' -ne 'success') { $failed += 'restore' }
          if ('${{ steps.build.outcome }}' -ne 'success') { $failed += 'build' }
          if ('${{ steps.test.outcome }}' -ne 'success') { $failed += 'test' }
          if ($failed.Count -gt 0) { throw ("Failed stages: " + ($failed -join ', ')) }
          Write-Host 'All stages succeeded.'
