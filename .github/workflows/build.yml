name: Dentiva CI

on:
  workflow_dispatch:
  push:
    branches: [ "arena/**", "main" ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Dentiva.sln

      - name: Build Release
        run: dotnet build Dentiva.sln -c Release --no-restore /warnaserror:CS0103,CS0246,CS1061,CS0117,CS7036,CS1503

      - name: Test
        run: dotnet test tests/Dentiva.Tests/Dentiva.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
